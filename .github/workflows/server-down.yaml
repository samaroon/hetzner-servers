name: Destroy Hetzner Dev Server

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Admin username (must match what was used at creation)"
        required: true
        type: string
      region:
        description: "Region the server was created in"
        required: true
        type: string
        default: hel1
      server_name_prefix:
        description: "Server name prefix (must match what was used at creation)"
        required: true
        type: string
        default: ubuntu-4gb
      work_email:
        description: "Requester work email — confirmation will be sent here"
        required: false
        type: string

jobs:
  terraform:
    name: Destroy Server
    runs-on: ubuntu-latest

    env:
      TF_VAR_hcloud_token:        ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_ssh_public_key:      ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_username:            ${{ inputs.username }}
      TF_VAR_full_name:           "unused"
      TF_VAR_password:            "unused"
      TF_VAR_region:              ${{ inputs.region }}
      TF_VAR_server_name_prefix:  ${{ inputs.server_name_prefix }}
      TF_VAR_image:               "ubuntu-24.04"

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Write Backend Config
        run: |
          cat > backend.hcl << 'EOF'
          bucket     = "${{ secrets.TF_STATE_BUCKET }}"
          key        = "hetzner-servers/${{ inputs.server_name_prefix }}-${{ inputs.region }}-${{ inputs.username }}/terraform.tfstate"
          region     = "${{ secrets.TF_STATE_REGION }}"
          access_key = "${{ secrets.HZ_S3_ACCESS_KEY }}"
          secret_key = "${{ secrets.HZ_S3_SECRET_KEY }}"
          endpoints = {
            s3 = "${{ secrets.TF_STATE_ENDPOINT }}"
          }
          skip_credentials_validation = true
          skip_metadata_api_check     = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          force_path_style            = true
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Check Resources Exist
        run: |
          RESOURCES=$(terraform state list 2>/dev/null | wc -l)
          if [ "$RESOURCES" -eq 0 ]; then
            echo "ERROR: No resources found in state for:"
            echo "  server_name_prefix: ${{ inputs.server_name_prefix }}"
            echo "  region:             ${{ inputs.region }}"
            echo "  username:           ${{ inputs.username }}"
            echo ""
            echo "Either the server was already destroyed or the inputs don't match creation."
            exit 1
          fi
          echo "Found $RESOURCES resource(s) to destroy."
          terraform state list

      - name: Terraform Destroy
        run: terraform destroy -auto-approve

      - name: Send Email Notification
        if: ${{ inputs.work_email != '' }}
        env:
          SENDGRID_API_KEY:   ${{ secrets.SENDGRID_API_KEY }}
          NOTIFY_FROM_EMAIL:  ${{ secrets.NOTIFY_FROM_EMAIL }}
          NOTIFY_FROM_NAME:   ${{ secrets.NOTIFY_FROM_NAME }}
        run: |
          EMAIL="${{ inputs.work_email }}"
          USERNAME="${{ inputs.username }}"
          SERVER_NAME="${{ inputs.server_name_prefix }}-${{ inputs.region }}-${{ inputs.username }}"
          FIRST_NAME=$(echo "$EMAIL" | cut -d@ -f1 | cut -d. -f1 | sed 's/./\u&/')
          TEAM_NAME="${NOTIFY_FROM_NAME:-DevOps}"

          SUBJECT="Your dev server has been destroyed — ${SERVER_NAME}"

          cat > /tmp/email_body.html << HTMLEOF
          <p>Hi ${FIRST_NAME},</p>
          <p>Your Hetzner dev server <strong>${SERVER_NAME}</strong> has been successfully destroyed.</p>
          <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;font-family:monospace">
            <tr><th>Detail</th><th>Value</th></tr>
            <tr><td>Server Name</td><td>${SERVER_NAME}</td></tr>
            <tr><td>Username</td><td>${USERNAME}</td></tr>
            <tr><td>Region</td><td>${{ inputs.region }}</td></tr>
          </table>
          <p>All resources have been removed and billing has stopped.</p>
          <p>Need a new server? Request one anytime through the developer portal.</p>
          <p>Thanks,<br>${TEAM_NAME}</p>
          HTMLEOF

          BODY=$(python3 -c "import json; print(json.dumps(open('/tmp/email_body.html').read()))")
          bash scripts/send-email.sh "$EMAIL" "$SUBJECT" "$BODY"
